name: Update GitHub Profile Stats

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/github-stats.yml"
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate GitHub stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=RDEsley&show_icons=true&include_all_commits=true&theme=tokyonight&border_radius=10&bg_color=0d1117&title_color=9d77e8&icon_color=9d77e8&text_color=c9d1d9&border_color=1e1e2e
          path: profile/stats.svg
          token: ${{ secrets.GH_STATS_TOKEN }}

      - name: Generate GitHub streak card
        uses: zients/github-readme-streak-stats@v2
        with:
          options: user=RDEsley&theme=tokyonight&starting_year=2023&background=0d1117&border=1e1e2e&stroke=1e1e2e&ring=9d77e8&fire=f97316&currStreakNum=c9d1d9&sideNums=c9d1d9&currStreakLabel=9d77e8&sideLabels=9d77e8&dates=c9d1d9&border_radius=10
          path: profile/streak.svg
          token: ${{ secrets.GH_STATS_TOKEN }}

      - name: Commit updated profile stats
        run: |
          git config user.name "Richard Oliveira"
          git config user.email "141041229+RDEsley@users.noreply.github.com"
          git add profile/stats.svg profile/streak.svg
          git diff --cached --quiet && exit 0
          git commit -m "chore: update GitHub profile stats"
          git pull --rebase origin main
          git push origin main
