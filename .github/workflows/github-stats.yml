name: Update GitHub Stats

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/github-stats.yml"
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=RDEsley&show_icons=true&include_all_commits=true&theme=tokyonight&border_radius=10&bg_color=0d1117&title_color=9d77e8&icon_color=9d77e8&text_color=c9d1d9&border_color=1e1e2e
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated stats
        run: |
          git config user.name "Richard Oliveira"
          git config user.email "141041229+RDEsley@users.noreply.github.com"
          git add profile/stats.svg
          git diff --cached --quiet && exit 0
          git commit -m "chore: update GitHub stats"
          git pull --rebase origin main
          git push origin main
